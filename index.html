<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>Vào 10 cùng Phúc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* VOICE: friendly older-sibling coach for a grade-9 student; short Vietnamese UI, English questions.
   IDEA: the multiple-choice answer sheet (phiếu trả lời trắc nghiệm) of the entrance exam.
   PICTURE: answer bubbles A B C D on every question; a countdown to exam day on Home.
   COLOUR and TYPE: exam-paper white, navy ink, blue brand, one orange for the main action; Be Vietnam Pro throughout.
   LAYOUT: phone first: slim top bar, one column, fixed bottom tab bar, 48px targets. */
:root{--bg:#F6F5F1;--paper:#FFFFFF;--paper2:#EEF0F5;--ink:#1B2A4A;--muted:#5D6880;--line:#D9DDE6;--brand:#2450D6;--on-brand:#fff;--accent:#E8582A;--on-accent:#fff;--good:#12805C;--good-bg:#E2F4EC;--bad:#C8322B;--bad-bg:#FCE9E7;--vi-bg:#E8EEFD;--warn-bg:#FFF1E2;--sel:#1B2A4A;
 --f:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ipa:'Noto Sans','Segoe UI','Arial Unicode MS',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1524;--paper:#182033;--paper2:#1F2A40;--ink:#E9EDF6;--muted:#A4AEC4;--line:#2D3A55;--brand:#8BA8FF;--on-brand:#0D1426;--accent:#FF8A5C;--on-accent:#1C0D05;--good:#5ED3A4;--good-bg:#123326;--bad:#FF9A92;--bad-bg:#3A1C1A;--vi-bg:#1D2B4D;--warn-bg:#3A2614;--sel:#E9EDF6;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0F1524;--paper:#182033;--paper2:#1F2A40;--ink:#E9EDF6;--muted:#A4AEC4;--line:#2D3A55;--brand:#8BA8FF;--on-brand:#0D1426;--accent:#FF8A5C;--on-accent:#1C0D05;--good:#5ED3A4;--good-bg:#123326;--bad:#FF9A92;--bad-bg:#3A1C1A;--vi-bg:#1D2B4D;--warn-bg:#3A2614;--sel:#E9EDF6;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f);overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-weight:800;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,7vw,32px)}h2{font-size:20px}h3{font-size:17px}
p{margin:0}a{color:var(--brand)}
.wrap{max-width:640px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px)) 0 max(14px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.brand svg{width:26px;height:26px;flex:none}
.chips{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.chips b{color:var(--ink)}
.pill{border:1.5px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;font:700 12px var(--f);padding:5px 10px;min-height:34px;cursor:pointer}
.pill.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ibtn{border:0;background:none;color:var(--muted);min-width:40px;min-height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.ibtn svg{width:22px;height:22px}
main{padding:16px 0 calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
body.focus main{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nb{display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;border:0;background:none;color:var(--muted);font:600 11.5px var(--f);cursor:pointer;min-height:58px}
.nb svg{width:24px;height:24px}
.nb.on{color:var(--brand)}
.nb.on svg{stroke-width:2.4}
body.focus .nav{display:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.soft{background:var(--paper2);border-color:transparent}
.stack{display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row.t{margin-top:0}
.lab{font-size:13px;font-weight:700;color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.btn{min-height:48px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font:700 15px var(--f);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.blue{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.xs{min-height:34px;padding:3px 10px;font-size:13px;border-width:1px;border-radius:8px}
.btn.ghost{border-color:transparent;color:var(--muted);text-decoration:underline;padding-inline:6px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.inp{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.chip{display:inline-block;font:700 12px var(--f);padding:3px 9px;border-radius:999px;background:var(--paper2);color:var(--brand)}
.chip.o{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;font:600 14px var(--f);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}
.prog.g i{background:var(--good)}.prog.r i{background:var(--bad)}
.hb{display:grid;grid-template-columns:minmax(0,8.5em) 1fr 3.4em;gap:10px;align-items:center;font-size:14px}
.hb b{text-align:right;font-weight:700;font-size:13px}
/* hero countdown */
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:grid;gap:10px;overflow:hidden;position:relative}
.hero .big{font-size:clamp(46px,16vw,64px);font-weight:800;line-height:1}
.hero .sub{opacity:.85;font-size:14px}
.hero svg.sheet{position:absolute;right:-6px;top:-6px;width:150px;opacity:.18}
.hero .btn{border-color:var(--bg);color:var(--bg)}
.hero .btn.pri{border-color:var(--accent)}
/* plan list */
.plan{display:grid;gap:10px}
.pi{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.pi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--vi-bg);color:var(--brand);font-weight:800}
.pi b{display:block}.pi small{color:var(--muted);font-size:13px}
.pi .go{color:var(--accent);font-weight:800;font-size:20px}
.pi.done{opacity:.6}
/* lesson */
.sbar{display:flex;align-items:center;gap:10px}
.sbar .prog{flex:1;height:10px}
.x{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;font-size:16px;cursor:pointer}
.stitle{font-size:13px;color:var(--muted);font-weight:600}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ins{font-weight:700;font-size:15px}
.tools{display:flex;gap:6px;flex:none}
.tool{border:1px solid var(--line);background:var(--paper);color:var(--brand);border-radius:8px;font:700 12.5px var(--f);padding:4px 9px;min-height:34px;cursor:pointer}
.tool.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tool.has{border-color:var(--accent);color:var(--accent)}
.vi{margin-top:8px;padding:10px 12px;background:var(--vi-bg);border-radius:10px;font-size:15px}
.vi p+p{margin-top:4px}.vi b{color:var(--brand)}
.qtext{font-size:18px;font-weight:600;margin-top:10px;line-height:1.45}
.passage{background:var(--paper2);border-radius:12px;padding:12px 14px;font-size:15.5px;max-height:42vh;overflow:auto;margin-top:10px;line-height:1.6}
.sign{margin-top:12px;border:3px solid var(--ink);border-radius:10px;padding:14px;text-align:center;font-weight:800;letter-spacing:.02em;font-size:17px;background:var(--paper)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;font:inherit;font-size:16px;cursor:pointer;min-height:54px}
.opt .bb{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--sel)}.opt.sel .bb{background:var(--sel);color:var(--bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}.opt.ok .bb{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}.opt.no .bb{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.opt u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.esent{font-size:18px;line-height:2;margin-top:12px}
.esent u{text-decoration-thickness:2px;text-underline-offset:4px}
.esent sup{font-size:11px;font-weight:800;color:var(--brand);margin-left:1px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border:1.5px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb p{margin-top:4px;font-size:15px}
.fcard{display:grid;place-items:center;align-content:center;gap:6px;width:100%;min-height:220px;margin:12px 0;padding:18px;border:2px dashed var(--line);border-radius:18px;background:var(--paper2);color:var(--ink);font:inherit;cursor:pointer}
.fw{font-size:34px;font-weight:800}.fi{font:400 20px var(--ipa);color:var(--muted)}.fv{font-size:26px;font-weight:800;color:var(--brand)}
.ex{color:var(--muted);font-style:italic}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mt{display:block;width:100%;margin-bottom:8px;min-height:52px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.mt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.mt.done{background:var(--good-bg);border-color:var(--good);opacity:.75}
.score{font-size:56px;font-weight:800;line-height:1}
.ipa{font-family:var(--ipa)}
.vl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.vl li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.vl .ipa{color:var(--brand);font-size:13px}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
summary{cursor:pointer;font-weight:700;color:var(--brand);min-height:36px;display:flex;align-items:center}
.prose p+p{margin-top:8px}.prose{font-size:15.5px}
/* exam */
.ebar{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.tmr{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.tmr.low{color:var(--bad);border-color:var(--bad)}
.grid40{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.grid40 button{min-height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:700 13px var(--f);cursor:pointer}
.grid40 button.a{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid40 button.c{box-shadow:0 0 0 2px var(--accent)}
.grid40 button.ok{background:var(--good);border-color:var(--good);color:#fff}.grid40 button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.rv{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.rv .q{font-weight:600}
.okt{color:var(--good);font-weight:700}.not{color:var(--bad);font-weight:700}
.npanel{margin-top:14px;padding:14px;border:1.5px dashed var(--accent);border-radius:14px}
.ntags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ntag{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:38px;font:600 13px var(--f);cursor:pointer}
.ntag.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nitem{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.nitem:first-child{border-top:0;padding-top:0}
.ntext{white-space:pre-wrap;background:var(--warn-bg);border-radius:8px;padding:8px 10px;font-size:15px}
.warn{background:var(--warn-bg);border-radius:12px;padding:10px 12px;font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:10px;padding:7px 0;text-align:center;font-size:12px;font-weight:700;background:var(--paper2);color:var(--muted)}
.wd.done{background:var(--good);color:#fff}.wd.today{box-shadow:0 0 0 2px var(--accent)}
.bars{display:grid;gap:6px;align-items:end;height:110px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--muted);font-weight:700}
.bars i{display:block;width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
pre{overflow-x:auto}.tipl{margin:0;padding-left:20px;display:grid;gap:8px}code{overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.chips .xpc{display:none}.mcols{grid-template-columns:1fr}}
</style>
</head>

<header class="top"><div class="wrap bar">
 <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="2" width="20" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="2.3" fill="#E8582A"/><circle cx="15" cy="9" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="16" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="16" r="2.3" fill="currentColor"/></svg><span>Vào 10</span></div>
 <div class="chips" id="chips"></div>
</div></header>
<main id="app" class="wrap"></main>
<nav class="nav" id="nav" aria-label="Điều hướng"><div class="in">
 <button class="nb" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hôm nay</button>
 <button class="nb" data-v="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg>Học</button>
 <button class="nb" data-v="drills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M11 7h9M11 17h9"/></svg>Luyện đề</button>
 <button class="nb" data-v="mock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>Thi thử</button>
 <button class="nb" data-v="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/></svg>Sổ tay</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const norm=s=>String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();

const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const fmtDate=t=>new Date(t).toLocaleDateString('vi-VN',{day:'numeric',month:'numeric',year:'numeric'});
const uline=s=>esc(s).replace(/\[([^\]]+)\]/g,'<u>$1</u>');
const LET='ABCD';
/* ---------- builders ---------- */
const M=(q,o,e,vi)=>({t:"mcq",q,o,e:e||"",qvi:vi||"",ex:"gv"});
const F=(q,a,e,hint,vi)=>({t:"fill",q,a,e:e||"",hint:hint||"",qvi:vi||"",ex:"gv"});

/* ---------- 12 topics of grade 9 (Global Success). vocab: [en, vi, example, IPA US] ---------- */
const TOPICS=[
{id:"t1",n:1,title:"Cộng đồng địa phương",en:"Local community",
 vocab:[["artisan","nghệ nhân","The artisan made this vase by hand.","/ˈɑːr.t̬ə.zən/"],["handicraft","đồ thủ công","Tourists love buying handicrafts.","/ˈhæn.di.kræft/"],["craft village","làng nghề","Bat Trang is a famous craft village.","/ˌkræft ˈvɪl.ɪdʒ/"],["pottery","đồ gốm","My aunt collects pottery.","/ˈpɑː.t̬ɚ.i/"],["firefighter","lính cứu hỏa","Firefighters are brave community helpers.","/ˈfaɪrˌfaɪ.t̬ɚ/"],["facility","cơ sở vật chất","Our town has good sports facilities.","/fəˈsɪl.ə.t̬i/"],["preserve","bảo tồn","We must preserve our traditions.","/prɪˈzɝːv/"],["hand down","truyền lại","The skill is handed down to children.","/ˌhænd ˈdaʊn/"],["attraction","điểm thu hút","The old bridge is a big attraction.","/əˈtræk.ʃən/"],["local","thuộc địa phương","We buy vegetables at the local market.","/ˈloʊ.kəl/"]],
 quiz:[M("Bat Trang is a famous ___ village near Hanoi.",["pottery","potter","pots","potted"],"pottery village = làng gốm.","Bát Tràng là một làng ___ nổi tiếng gần Hà Nội."),

 vocab:[["device","thiết bị","Turn off all devices in class.","/dɪˈvaɪs/"],["tablet","máy tính bảng","I read e-books on my tablet.","/ˈtæb.lət/"],["charger","bộ sạc","Can I borrow your charger?","/ˈtʃɑːr.dʒɚ/"],["screen","màn hình","Don't look at the screen too long.","/skriːn/"],["app","ứng dụng","This app helps me learn words.","/æp/"],["battery","pin","My phone battery is low.","/ˈbæt̬.ɚ.i/"],["download","tải về","Download the file to your phone.","/ˈdaʊn.loʊd/"],["robot vacuum","robot hút bụi","The robot vacuum cleans the floor.","/ˌroʊ.bɑːt ˈvæk.juːm/"],["digital","kỹ thuật số","We live in a digital world.","/ˈdɪdʒ.ə.t̬əl/"],["plug in","cắm điện","Plug in the laptop, please.","/ˌplʌɡ ˈɪn/"]],
 quiz:[M("My phone ___ is low. Can I borrow your charger?",["battery","screen","app","tablet"],"battery = pin.","___ điện thoại tôi yếu. Cho tôi mượn sạc nhé?"),
  M("This app ___ by millions of students every day.",["is used","uses","used","is using"],"Bị động hiện tại đơn: is used.","Ứng dụng này ___ bởi hàng triệu học sinh mỗi ngày."),
  M("You should not spend too much time ___ at screens.",["looking","look","to look","looked"],"spend time + V-ing.","Bạn không nên dành quá nhiều thời gian ___ màn hình."),
  M("Can you tell me how ___ this robot vacuum?",["to use","using","use","used"],"how + to V.","Bạn chỉ tôi cách ___ robot hút bụi này được không?"),
  F("Remember to ___ in the charger before you go to bed.",["plug"],"plug in = cắm điện.","cắm","Nhớ ___ sạc trước khi đi ngủ."),
  M("My brother asked me if I ___ a new tablet.",["wanted","want","will want","am wanting"],"Câu tường thuật: lùi thì want → wanted.","Anh tôi hỏi tôi có ___ máy tính bảng mới không.")]},
{id:"t12",n:12,title:"Chọn nghề nghiệp",en:"Career choices",
 vocab:[["career","sự nghiệp, nghề","She wants a career in medicine.","/kəˈrɪr/"],["vocational","thuộc học nghề","He goes to a vocational school.","/voʊˈkeɪ.ʃən.əl/"],["qualification","bằng cấp","You need good qualifications.","/ˌkwɑː.lə.fəˈkeɪ.ʃən/"],["skill","kỹ năng","Teamwork is an important skill.","/skɪl/"],["apply","nộp đơn","I will apply for the job.","/əˈplaɪ/"],["salary","tiền lương","The salary is high.","/ˈsæl.ɚ.i/"],["interview","phỏng vấn","I have a job interview tomorrow.","/ˈɪn.t̬ɚ.vjuː/"],["passion","đam mê","Cooking is my passion.","/ˈpæʃ.ən/"],["mechanic","thợ máy","The mechanic fixed my bike.","/məˈkæn.ɪk/"],["flexible","linh hoạt","I like flexible working hours.","/ˈflek.sə.bəl/"]],
 quiz:[M("He wants to work as a ___ because he loves fixing cars.",["mechanic","mechanical","machine","mechanism"],"mechanic = thợ máy (người).","Anh ấy muốn làm ___ vì thích sửa ô tô."),
  M("She is going to ___ for a job at a hospital.",["apply","applicant","application","applied"],"be going to + V: apply for a job.","Cô ấy sẽ ___ xin việc ở bệnh viện."),
  M("A ___ school teaches students practical skills for a job.",["vocational","vocation","vacation","vocal"],"vocational school = trường nghề.","Trường ___ dạy học sinh kỹ năng thực tế cho công việc."),
  M("You should choose a career ___ suits your interests.",["that","who","where","whose"],"Mệnh đề quan hệ cho vật: that/which.","Bạn nên chọn nghề ___ hợp với sở thích."),
  F("Good communication is an important ___ for any job.",["skill"],"skill = kỹ năng.","kỹ năng","Giao tiếp tốt là ___ quan trọng cho mọi công việc."),
  M("He's interested ___ becoming a doctor.",["in","on","at","with"],"interested in + V-ing.","Cậu ấy thích ___ trở thành bác sĩ.")]}

/* ---------- 10 grammar topics for the exam ---------- */
const G=(q,o,e,vi)=>({t:"mcq",q,o,e,qvi:vi,ex:"gv"});
const GRAM=[
{id:"g1",title:"Các thì cơ bản",en:"Tenses",tip:"<p><b>Hiện tại đơn</b>: thói quen, sự thật (every day, usually). <b>Hiện tại tiếp diễn</b>: đang xảy ra (now, at the moment).</p><p><b>Hiện tại hoàn thành</b> (have/has + V3): đã làm, kết quả còn đến nay (since, for, already, yet, so far, ever).</p><p><b>Quá khứ đơn</b>: xong, có mốc quá khứ (yesterday, ago, last…). <b>Quá khứ tiếp diễn</b>: đang làm thì việc khác xen vào (when/while).</p>",
 q:[G("She ___ to school by bike every day.",["goes","go","is going","went"],"every day → hiện tại đơn, she + goes.","Cô ấy ___ học bằng xe đạp mỗi ngày."),
  G("Look! The children ___ in the garden.",["are playing","play","played","have played"],"Look! → hiện tại tiếp diễn.","Nhìn kìa! Bọn trẻ ___ trong vườn."),
  G("I ___ this book since last week.",["have read","read","am reading","reads"],"since → hiện tại hoàn thành.","Tôi ___ cuốn sách này từ tuần trước."),
  G("We ___ Hue two years ago.",["visited","have visited","visit","were visiting"],"ago → quá khứ đơn.","Chúng tôi ___ Huế hai năm trước."),
  G("I was watching TV when my mum ___ home.",["came","was coming","comes","has come"],"Việc đang xảy ra (QKTD) bị việc khác xen vào (QKĐ).","Tôi đang xem TV thì mẹ ___ về nhà."),
  G("Have you finished your homework ___?",["yet","already","ago","since"],"yet trong câu hỏi hiện tại hoàn thành.","Bạn đã làm xong bài tập ___?"),
  G("They ___ in this town for ten years.",["have lived","lived","live","are living"],"for + khoảng thời gian đến nay → hiện tại hoàn thành.","Họ ___ ở thị trấn này mười năm rồi."),
  G("While I ___ my homework, the lights went out.",["was doing","did","am doing","have done"],"While + quá khứ tiếp diễn.","Trong khi tôi ___ bài tập thì mất điện.")]},
{id:"g2",title:"Câu bị động",en:"Passive voice",tip:"<p>Công thức: <b>be + V3</b>. Thì của câu nằm ở <b>be</b>: is/are + V3 (hiện tại), was/were + V3 (quá khứ), has/have been + V3, will be + V3, can/must/should be + V3.</p><p>Chủ động → bị động: tân ngữ thành chủ ngữ; chủ ngữ cũ thành <b>by + O</b> (có thể bỏ nếu không quan trọng).</p>",
 q:[G("English ___ in many countries.",["is spoken","speaks","is speaking","spoke"],"Bị động hiện tại đơn: is spoken.","Tiếng Anh ___ ở nhiều nước."),
  G("This bridge ___ in 1902.",["was built","built","is built","has built"],"Mốc quá khứ → was built.","Cây cầu này ___ năm 1902."),
  G("The new school ___ next year.",["will be opened","will open","opens","is opening"],"next year → will be + V3.","Trường mới ___ vào năm sau."),
  G("Mobile phones must ___ off during the test.",["be turned","turn","turned","be turning"],"must be + V3.","Điện thoại phải ___ trong giờ kiểm tra."),
  G("Many trees ___ by the students last week.",["were planted","planted","are planted","have planted"],"last week, chủ ngữ số nhiều → were + V3.","Nhiều cây ___ bởi học sinh tuần trước."),
  G("The letter has just ___.",["been sent","sent","send","being sent"],"has been + V3.","Lá thư vừa ___."),
  G("Rice ___ in many parts of Vietnam.",["is grown","grows by","is growing","grew"],"Sự thật → bị động hiện tại đơn.","Lúa ___ ở nhiều vùng của Việt Nam."),
  G("“They clean the classroom every day.” → The classroom ___ every day.",["is cleaned","cleans","was cleaned","is cleaning"],"Chuyển bị động giữ thì hiện tại đơn.","Lớp học ___ mỗi ngày.")]},
{id:"g3",title:"Câu điều kiện loại 1, 2",en:"Conditionals",tip:"<p><b>Loại 1</b> (có thể xảy ra): <i>If + hiện tại đơn, will/can + V</i>. If it rains, we will stay home.</p><p><b>Loại 2</b> (trái hiện tại): <i>If + quá khứ đơn, would/could + V</i>. Với be dùng <b>were</b> cho mọi ngôi. If I were you, I would…</p><p><b>Unless</b> = If… not.</p>",
 q:[G("If it ___ tomorrow, we will cancel the picnic.",["rains","rained","will rain","rain"],"Loại 1: If + hiện tại đơn.","Nếu mai trời ___, chúng ta sẽ hủy dã ngoại."),
  G("If I had a lot of money, I ___ a big house.",["would buy","will buy","buy","bought"],"Loại 2: would + V.","Nếu tôi có nhiều tiền, tôi ___ một ngôi nhà lớn."),
  G("If I ___ you, I would study harder.",["were","am","was being","will be"],"If I were you = nếu tôi là bạn.","Nếu tôi ___ bạn, tôi sẽ học chăm hơn."),
  G("___ you hurry, you will miss the bus.",["Unless","If","When","Because"],"Unless = nếu không.","___ bạn nhanh lên, bạn sẽ lỡ xe buýt."),
  G("If she studies hard, she ___ the exam.",["will pass","would pass","passed","passes"],"Loại 1: will + V.","Nếu cô ấy học chăm, cô ấy ___ kỳ thi."),
  G("What would you do if you ___ a famous singer?",["were","are","will be","have been"],"Loại 2: were.","Bạn sẽ làm gì nếu bạn ___ ca sĩ nổi tiếng?"),
  G("If we don't protect the forests, many animals ___.",["will disappear","would disappear","disappeared","disappear"],"Loại 1 (hậu quả có thể xảy ra).","Nếu không bảo vệ rừng, nhiều loài vật ___."),
  G("I can't go out because I have a lot of homework. → If I ___ a lot of homework, I could go out.",["didn't have","don't have","hadn't","haven't"],"Trái hiện tại → loại 2, phủ định: didn't have.","Nếu tôi ___ nhiều bài tập, tôi có thể ra ngoài.")]},
{id:"g4",title:"Câu ước (wish)",en:"Wish sentences",tip:"<p>Ước trái với <b>hiện tại</b>: <i>S + wish + S + quá khứ đơn</i> (be → were). I wish I were taller. I wish I could swim.</p><p>Ước cho <b>tương lai</b>: <i>S + wish + S + would + V</i>. I wish it would stop raining.</p>",
 q:[G("I wish I ___ taller.",["were","am","will be","have been"],"Ước hiện tại: were.","Tôi ước tôi ___ cao hơn."),
  G("She wishes she ___ speak French.",["could","can","will","is able"],"can → could trong câu ước.","Cô ấy ước cô ấy ___ nói tiếng Pháp."),
  G("I wish my brother ___ so much time on games.",["didn't spend","doesn't spend","won't spend","hasn't spent"],"Ước hiện tại, phủ định: didn't + V.","Tôi ước anh tôi ___ quá nhiều thời gian chơi game."),
  G("I wish it ___ raining. I want to go out.",["would stop","stops","stopped to","has stopped"],"Ước điều trong tương lai gần: would + V.","Tôi ước trời ___ mưa. Tôi muốn ra ngoài."),
  G("It's a pity I don't have a pet. → I wish I ___ a pet.",["had","have","will have","am having"],"don't have → wish + had.","Tôi ước tôi ___ một con thú cưng."),
  G("We wish we ___ in a bigger house.",["lived","live","are living","will live"],"Ước hiện tại: quá khứ đơn.","Chúng tôi ước chúng tôi ___ ở nhà to hơn."),
  G("He wishes he ___ the answer now.",["knew","knows","known","has known"],"now → ước hiện tại: knew.","Cậu ấy ước bây giờ cậu ___ đáp án."),
  G("I wish you ___ to my party next Sunday.",["would come","came","come","will come"],"Mong muốn về tương lai: would + V.","Tôi mong bạn ___ dự tiệc Chủ nhật tới.")]},
{id:"g5",title:"Câu tường thuật",en:"Reported speech",tip:"<p>Lùi thì: hiện tại → quá khứ; will → would; can → could; hiện tại hoàn thành → quá khứ hoàn thành.</p><p>Đổi: I → he/she, now → then, today → that day, tomorrow → the next day, here → there.</p><p>Câu hỏi Yes/No: <i>asked + if/whether + S + V</i>. Câu hỏi Wh-: <i>asked + từ để hỏi + S + V</i> (không đảo ngữ). Mệnh lệnh: <i>told/asked + O + (not) to V</i>.</p>",
 q:[G("“I am hungry,” Nam said. → Nam said that he ___ hungry.",["was","is","has been","were"],"Lùi thì: am → was.","Nam nói rằng cậu ấy ___ đói."),
  G("She asked me where I ___.",["lived","did I live","do I live","live"],"Câu hỏi tường thuật không đảo ngữ, lùi thì.","Cô ấy hỏi tôi ___ ở đâu."),
  G("He asked me ___ I liked football.",["if","that","what","which"],"Câu hỏi Yes/No → if/whether.","Anh ấy hỏi tôi ___ thích bóng đá không."),
  G("The teacher told us ___ late.",["not to be","don't be","not be","to not being"],"told + O + not to V.","Cô giáo dặn chúng tôi ___ đến muộn."),
  G("“I will call you tomorrow,” she said. → She said she would call me ___.",["the next day","tomorrow","yesterday","today"],"tomorrow → the next day.","Cô ấy nói sẽ gọi tôi ___."),
  G("“Can you help me?” Lan asked. → Lan asked me if I ___ help her.",["could","can","will","may"],"can → could.","Lan hỏi tôi có ___ giúp cô ấy không."),
  G("Mum told me ___ my room.",["to clean","clean","cleaning","cleaned"],"told + O + to V.","Mẹ bảo tôi ___ phòng."),
  G("He said that he ___ that film before.",["had seen","has seen","saw","sees"],"Hiện tại hoàn thành → quá khứ hoàn thành.","Anh ấy nói đã ___ bộ phim đó trước đây.")]},
{id:"g6",title:"Mệnh đề quan hệ",en:"Relative clauses",tip:"<p><b>who</b>: người (chủ ngữ). <b>whom</b>: người (tân ngữ). <b>which</b>: vật. <b>that</b>: người hoặc vật (không dùng sau dấu phẩy). <b>whose</b>: của ai/cái gì + danh từ. <b>where</b>: nơi chốn. <b>when</b>: thời gian.</p><p>Có dấu phẩy (mệnh đề không xác định) thì không dùng <b>that</b>.</p>",
 q:[G("The man ___ lives next door is a doctor.",["who","which","whose","where"],"Người, làm chủ ngữ → who.","Người đàn ông ___ sống cạnh nhà là bác sĩ."),
  G("This is the book ___ I bought yesterday.",["which","who","whose","where"],"Vật → which/that.","Đây là cuốn sách ___ tôi mua hôm qua."),
  G("Do you know the girl ___ bike was stolen?",["whose","who","which","whom"],"whose + danh từ (sở hữu).","Bạn có biết cô gái ___ xe đạp bị mất không?"),
  G("Ha Noi is the city ___ I was born.",["where","which","when","who"],"Nơi chốn → where.","Hà Nội là thành phố ___ tôi sinh ra."),
  G("I will never forget the day ___ we first met.",["when","where","which","who"],"Thời gian → when.","Tôi sẽ không bao giờ quên ngày ___ chúng ta gặp nhau."),
  G("My father, ___ is 50, still plays football.",["who","that","which","whom"],"Sau dấu phẩy không dùng that; người → who.","Bố tôi, ___ đã 50 tuổi, vẫn chơi bóng đá."),
  G("The teacher ___ we met yesterday is very kind.",["whom","whose","which","where"],"Người, làm tân ngữ → whom (hoặc who/that).","Cô giáo ___ chúng ta gặp hôm qua rất tốt bụng."),
  G("Phong Nha, ___ has many caves, is in Quang Binh.",["which","that","where","who"],"Vật, sau dấu phẩy → which.","Phong Nha, ___ có nhiều hang động, ở Quảng Bình.")]},
{id:"g7",title:"So sánh",en:"Comparisons",tip:"<p>Ngắn: <b>-er than</b>, <b>the -est</b>. Dài: <b>more … than</b>, <b>the most …</b>. Bất quy tắc: good → better → best; bad → worse → worst; far → farther/further.</p><p>Bằng: <b>as + adj + as</b>; không bằng: <b>not as/so … as</b>. So sánh kép: <b>-er and -er</b>, <b>more and more + adj</b>, <b>The + so sánh hơn…, the + so sánh hơn…</b></p>",
 q:[G("My house is ___ than yours.",["bigger","big","biggest","more big"],"Tính từ ngắn: bigger than.","Nhà tôi ___ nhà bạn."),
  G("This is the ___ film I have ever seen.",["most interesting","more interesting","interestingest","most interest"],"So sánh nhất tính từ dài.","Đây là bộ phim ___ tôi từng xem."),
  G("Lan sings ___ than her sister.",["better","good","best","more good"],"well → better.","Lan hát ___ chị cô ấy."),
  G("My English is not as good ___ yours.",["as","than","so","like"],"not as … as.","Tiếng Anh của tôi không giỏi ___ bạn."),
  G("It's getting ___.",["colder and colder","more and more cold","cold and colder","coldest and coldest"],"So sánh kép tính từ ngắn.","Trời ngày càng ___."),
  G("The harder you study, ___ results you get.",["the better","the best","better","good"],"The + so sánh hơn…, the + so sánh hơn.","Bạn càng học chăm, kết quả ___."),
  G("Everest is the ___ mountain in the world.",["highest","higher","most high","high"],"So sánh nhất: the highest.","Everest là ngọn núi ___ thế giới."),
  G("Travelling by plane is ___ than by train.",["more expensive","expensiver","most expensive","as expensive"],"Tính từ dài: more expensive.","Đi máy bay ___ đi tàu.")]},
{id:"g8",title:"To V, V-ing và used to",en:"Gerunds, infinitives, used to",tip:"<p><b>+ V-ing</b>: enjoy, mind, avoid, finish, practise, spend time, be interested in, look forward to.</p><p><b>+ to V</b>: want, decide, hope, plan, agree, learn, would like, need.</p><p><b>used to + V</b>: thói quen trong quá khứ. <b>be/get used to + V-ing</b>: quen với việc gì.</p>",
 q:[G("I enjoy ___ to music in my free time.",["listening","to listen","listen","listened"],"enjoy + V-ing.","Tôi thích ___ nhạc lúc rảnh."),
  G("She decided ___ English abroad.",["to study","studying","study","studied"],"decide + to V.","Cô ấy quyết định ___ tiếng Anh ở nước ngoài."),
  G("We are looking forward to ___ you.",["seeing","see","to see","saw"],"look forward to + V-ing.","Chúng tôi mong được ___ bạn."),
  G("My grandfather used to ___ a farmer.",["be","being","been","is"],"used to + V nguyên mẫu.","Ông tôi từng ___ nông dân."),
  G("I'm used to ___ up early.",["getting","get","got","to get"],"be used to + V-ing: quen với.","Tôi quen ___ sớm rồi."),
  G("Would you mind ___ the door?",["closing","to close","close","closed"],"mind + V-ing.","Bạn có phiền ___ cửa không?"),
  G("He wants ___ a doctor in the future.",["to become","becoming","become","became"],"want + to V.","Cậu ấy muốn ___ bác sĩ trong tương lai."),
  G("They spent two hours ___ for the test.",["preparing","to prepare","prepare","prepared"],"spend time + V-ing.","Họ dành hai giờ ___ cho bài kiểm tra.")]},
{id:"g9",title:"Liên từ và nối câu",en:"Connectors",tip:"<p><b>although / though + mệnh đề</b> = <b>despite / in spite of + danh từ/V-ing</b> (mặc dù).</p><p><b>because + mệnh đề</b> = <b>because of + danh từ/V-ing</b> (vì). <b>so</b> (vì vậy), <b>but</b> (nhưng), <b>however</b> (tuy nhiên).</p><p><b>so + adj + that</b>, <b>such + (a/an) + adj + N + that</b> (quá… đến nỗi). <b>too + adj + to V</b> (quá… không thể). <b>adj + enough + to V</b> (đủ… để).</p>",
 q:[G("___ it was raining, we went to school.",["Although","Despite","Because","So"],"Although + mệnh đề.","___ trời mưa, chúng tôi vẫn đi học."),
  G("___ the heavy rain, the match continued.",["Despite","Although","Because","However"],"Despite + cụm danh từ.","___ mưa to, trận đấu vẫn tiếp tục."),
  G("We stayed at home ___ the storm.",["because of","because","although","so"],"because of + danh từ.","Chúng tôi ở nhà ___ cơn bão."),
  G("She was ill, ___ she didn't go to school.",["so","but","because","although"],"so = vì vậy.","Cô ấy ốm, ___ không đi học."),
  G("The box is too heavy for me ___.",["to carry","carrying","carry","to carrying"],"too + adj + (for sb) + to V.","Cái hộp quá nặng, tôi không ___ được."),
  G("He is old ___ to drive a car.",["enough","too","so","such"],"adj + enough + to V.","Anh ấy ___ tuổi để lái xe."),
  G("It was ___ a good film that we watched it twice.",["such","so","too","enough"],"such + a + adj + N + that.","Đó là một bộ phim hay ___ chúng tôi xem hai lần."),

const ALLV=TOPICS.flatMap(t=>t.vocab.map(v=>({en:v[0],vi:v[1],ex:v[2],ipa:v[3],t:t.id})));
function dis(W,key){return shuffle(ALLV.filter(v=>v.t===W.t&&v[key]!==W[key])).concat(shuffle(ALLV.filter(v=>v.t!==W.t&&v[key]!==W[key]))).slice(0,3).map(v=>v[key])}
function genVocab(t){const out=[];t.vocab.forEach(v=>{const W={en:v[0],vi:v[1],ex:v[2],ipa:v[3],t:t.id};
  out.push({t:'mcq',q:'What does “<b>'+esc(W.en)+'</b>” mean?',qvi:'“'+W.en+'” nghĩa là gì?',o:[W.vi].concat(dis(W,'vi')),e:W.en+' '+W.ipa+' = '+W.vi+'. Ví dụ: '+W.ex,say:W.en,ipa:W.ipa,ex:'vocab'});
  out.push({t:'mcq',q:'Which word means “'+esc(W.vi)+'”?',qvi:'Từ nào có nghĩa “'+W.vi+'”?',o:[W.en].concat(dis(W,'en')),e:W.en+' '+W.ipa+'. Ví dụ: '+W.ex,ex:'vocab'});
  out.push({t:'listen',s:W.en,q:'Which word do you hear?',o:[W.en].concat(dis(W,'en')),e:W.en+' '+W.ipa+' = '+W.vi,ex:'vocab'})});return out}
const quizEsc=q=>Object.assign({},q,{q:esc(q.q)});
const matchStep=vs=>({t:'match',pairs:sample(vs,5).map(v=>[v[0],v[1]]),ex:'vocab'});
function topicSteps(t,kind){
  const q=t.quiz.map(quizEsc),gv=genVocab(t);
  if(kind==='quick')return shuffle(sample(q,3).concat(sample(gv,2)));
  return [{t:'cards',words:t.vocab,ex:'vocab'},matchStep(t.vocab)].concat(shuffle(q.concat(sample(gv.filter(x=>x.t==='mcq'),4),sample(gv.filter(x=>x.t==='listen'),2))));
}
function gramSteps(g){return [{t:'tip',title:g.title,html:g.tip}].concat(shuffle(g.q.map(quizEsc)))}
const GV_POOL=()=>GRAM.flatMap(g=>g.q).concat(TOPICS.flatMap(t=>t.quiz.filter(q=>q.t==='mcq'))).map(quizEsc);
function drillSteps(x){
  if(x==='pron')return sample(PRON,8);if(x==='stress')return sample(STRESSQ,8);if(x==='sign')return sample(SIGNS,6);
  if(x==='gv')return sample(GV_POOL(),10);if(x==='comm')return sample(COMM,8).map(quizEsc);if(x==='err')return sample(ERRS,8);

  if(x==='cloze')return clozeSteps(sample(CLOZE,1)[0]);if(x==='read')return readSteps(sample(READ,1)[0]);return[];
}

}

  if(S.mocks.length>1)h+=mockChart();

};

/* ================= session engine ================= */
function go(v){try{speechSynthesis.cancel()}catch(e){}stopTimer();view=v;SES=null;document.body.classList.remove('focus');render();window.scrollTo(0,0)}
function startSession(o){if(!o.steps||!o.steps.length){toast('Chưa có câu nào ở đây.');return}stopTimer();SES=Object.assign({i:0,ok:0,total:0,wrong:[],wlog:[],sk:{},t0:Date.now(),xp0:S.xp,from:view==='settings'?'home':view,over:false,quitAsk:false},o);document.body.classList.add('focus');if(SES.exam){SES.sts=SES.steps.map(prepSt);SES.end=Date.now()+60*60e3;startTimer()}else SES.st=prepSt(SES.steps[0]);render();window.scrollTo(0,0)}
const cur=()=>SES&&SES.steps[SES.i];
function prepSt(s){const st={};
  if(s.t==='mcq'||s.t==='listen')st.opts=s.fixedOrder===true?s.o.map((t,i)=>({t,c:i===0})):shuffle(s.o.map((t,i)=>({t,c:i===0})));
  if(s.t==='err')st.opts=s.parts.map((t,i)=>({t,c:i===s.wi}));
  if(s.t==='match'){st.L=shuffle(s.pairs.map((p,i)=>({t:p[0],i,done:false})));st.R=shuffle(s.pairs.map((p,i)=>({t:p[1],i,done:false})));st.sel=null;st.miss=0}
  if(s.t==='cards'){st.k=0;st.flip=false}return st}
const skillOf=s=>s.ex||'gv';
function itemKey(s,st){if(s.t==='cards')return 'w:'+s.words[st.k][0];return 'q:'+hash(JSON.stringify([s.t,s.q||'',s.s||'',s.parts||'',s.sign||'',s.pairs||'',s.o||'',strip(s.ctx||'').slice(0,30)]))}
function itemLabel(s,st){if(s.t==='cards')return s.words[st.k][0]+' = '+s.words[st.k][1];if(s.t==='match')return 'Ghép từ: '+s.pairs.map(p=>p[0]).join(', ');if(s.t==='tip')return 'Ngữ pháp: '+s.title;if(s.t==='err')return 'Tìm lỗi: '+s.parts.join(' ');if(s.sign)return 'Biển báo: '+s.sign;if(s.ins==='pron'||s.ins==='stressQ')return (s.ins==='pron'?'Phát âm: ':'Trọng âm: ')+s.o.map(x=>x.replace(/[\[\]]/g,'')).join(', ');if(s.t==='listen')return 'Nghe: '+s.s;return strip(s.q)+(s.ctx?' · '+strip(s.ctx).slice(0,40)+'…':'')}
const ansText=(s,st)=>s.t==='fill'?s.a[0]:s.t==='err'?s.parts[s.wi]:(st.opts.find(o=>o.c)||{}).t;
function logRes(s,st,ok){const k=itemKey(s,st);let e=S.errs[k];if(!ok){e=e||{k,label:itemLabel(s,st),sk:skillOf(s),step:JSON.parse(JSON.stringify(s)),n:0};e.n++;e.last=false;e.ts=Date.now();S.errs[k]=e}else if(e){e.last=true;e.ts=Date.now()}}
function tally(s,st,ok,mine){const k=skillOf(s),r=SES.sk[k]||(SES.sk[k]={n:0,ok:0});r.n++;if(ok)r.ok++;if(!ok&&SES.wlog.length<40)SES.wlog.push({label:itemLabel(s,st),ans:s.t==='match'?'':String(ansText(s,st)||'').replace(/[\[\]]/g,''),mine:mine||'',e:s.e||'',sk:k})}
function finish(ok){const s=cur(),st=SES.st;st.done=true;st.ok=ok;SES.total++;if(ok){SES.ok++;S.xp+=10}else{S.xp+=2;SES.wrong.push(s)}tally(s,st,ok,st.pick!=null&&st.opts?st.opts[st.pick].t:st.val);logRes(s,st,ok);save();render()}
function next(){try{speechSynthesis.cancel()}catch(e){}SES.i++;if(SES.i>=SES.steps.length){endSession();return}SES.st=prepSt(cur());render();window.scrollTo(0,0)}
function markToday(k){S.today=S.today||{};S.today[k]=dayIdx()}
function endSession(){
  const mins=Math.max(1,Math.round((Date.now()-SES.t0)/60000)),acc=SES.total?Math.round(SES.ok/SES.total*100):null;
  SES.prev=(S.hist||[]).filter(h=>h.acc!=null).slice(-5);
  S.sessions++;const d=dayIdx();S.days[d]=(S.days[d]||0)+mins;S.xp+=10;
  if(SES.topic&&!SES.retry){const p=S.topics[SES.topic]||(S.topics[SES.topic]={done:0,best:0});p.done++;p.best=Math.max(p.best,acc||0);markToday('topic')}
  if(SES.gram&&!SES.retry){const p=S.gram[SES.gram]||(S.gram[SES.gram]={done:0,best:0});p.done++;p.best=Math.max(p.best,acc||0);markToday('gram')}
  if(SES.drill)markToday('drill');
  S.hist=(S.hist||[]).concat([{ts:Date.now(),title:SES.title,acc,sk:SES.sk,mins}]).slice(-80);
  save();SES.over=true;SES.mins=mins;render();window.scrollTo(0,0);
}

/* ---------- exam mode ---------- */
let TMR=null;
function startTimer(){stopTimer();TMR=setInterval(()=>{if(!SES||!SES.exam||SES.over){stopTimer();return}const left=SES.end-Date.now();const el=$('#tmr');if(el){el.textContent=fmtT(left);el.classList.toggle('low',left<5*60e3)}if(left<=0){stopTimer();toast('Hết giờ! Bài đã được nộp.');submitExam()}},1000)}
function stopTimer(){if(TMR){clearInterval(TMR);TMR=null}}
const fmtT=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')};
function submitExam(){
  stopTimer();const mins=Math.max(1,Math.round((Date.now()-SES.t0)/60000));let c=0;
  SES.steps.forEach((s,i)=>{const st=SES.sts[i],ok=st.pick!=null&&st.opts[st.pick].c;if(ok)c++;tally(s,st,ok,st.pick!=null?st.opts[st.pick].t:'(bỏ trống)');logRes(s,st,ok)});
  const score=Math.round(c*0.25*100)/100;SES.result={c,score,mins};SES.prevMock=S.mocks[S.mocks.length-1];
  S.mocks.push({ts:Date.now(),score,correct:c,mins,sk:SES.sk});S.sessions++;const d=dayIdx();S.days[d]=(S.days[d]||0)+mins;S.xp+=c*3;
  S.hist=(S.hist||[]).concat([{ts:Date.now(),title:'Thi thử',acc:Math.round(c/40*100),sk:SES.sk,mins}]).slice(-80);
  save();SES.over=true;SES.reviewWrong=true;render();window.scrollTo(0,0);
}

  return h;

function examResultHTML(){
  const r=SES.result,pm=SES.prevMock,sk=Object.entries(SES.sk).map(([k,v])=>({k,n:v.n,ok:v.ok,p:Math.round(v.ok/v.n*100)})).sort((a,b)=>a.p-b.p);
  const lines=[];
  lines.push(r.score>=9?'Rất xuất sắc! Giữ phong độ bằng cách làm đều 1 đề mỗi tuần.':r.score>=8?'Tốt! Bạn đang ở mức điểm khá cao; tập trung sửa các dạng còn sai để chạm 9.':r.score>=6.5?'Khá. Bạn nắm phần lớn kiến thức; ôn kỹ 2 dạng yếu nhất bên dưới sẽ tăng điểm nhanh nhất.':r.score>=5?'Trung bình. Hãy ôn lại ngữ pháp trọng tâm (tab Học) và luyện từng dạng đề trước khi làm đề tiếp.':'Điểm còn thấp, nhưng đây là lúc biết mình hổng chỗ nào. Mỗi ngày học 1 chủ đề + 1 chuyên đề ngữ pháp, 1 tuần sau làm lại đề.');
  if(pm){const d=Math.round((r.score-pm.score)*100)/100;lines.push(d>0?'Tăng <b>'+d+'</b> điểm so với lần thi thử trước ('+pm.score+' → '+r.score+').':d<0?'Giảm <b>'+(-d)+'</b> điểm so với lần trước ('+pm.score+' → '+r.score+'). Có thể đề này khó hơn ở dạng bạn yếu; xem phần phân tích dưới.':'Bằng điểm lần trước ('+r.score+').')}
  lines.push('Thời gian làm: '+r.mins+' phút'+(r.mins<30?'. Bạn làm khá nhanh; lần sau dành thời gian kiểm tra lại các câu đọc hiểu và tìm lỗi sai.':r.mins>=58?'. Bạn dùng gần hết giờ; hãy làm câu dễ (phát âm, giao tiếp, biển báo) thật nhanh để dành thời gian cho đọc hiểu.':'.'));
  const weak=sk.filter(x=>x.p<70).slice(0,2);

  let h='<div class="card stack" style="text-align:center"><p class="lab">Kết quả thi thử</p><div class="score">'+r.score+'<span style="font-size:24px">/10</span></div><p>'+r.c+'/40 câu đúng</p></div>';
  h+='<div class="card stack"><p class="lab">Nhận xét</p><div class="prose">'+lines.map(x=>'<p>'+x+'</p>').join('')+'</div>'+sk.map(x=>'<div class="hb"><span>'+XT[x.k]+'</span>'+prog(x.p,x.p>=80?'g':x.p<60?'r':'')+'<b>'+x.ok+'/'+x.n+'</b></div>').join('')+(weak.length?'<div class="row t">'+weak.map(x=>'<button class="btn sm pri" data-act="drill" data-id="'+x.k+'">Luyện '+XT[x.k]+'</button>').join('')+'</div>':'')+'</div>';
  h+='<div class="card stack"><div class="row t" style="justify-content:space-between;align-items:center"><p class="lab">Xem lại bài</p><div class="seg"><button class="'+(SES.reviewWrong?'on':'')+'" data-act="rvw" data-k="1">Câu sai</button><button class="'+(!SES.reviewWrong?'on':'')+'" data-act="rvw" data-k="0">Tất cả</button></div></div><div class="grid40">'+SES.steps.map((x,i)=>{const st=SES.sts[i],ok=st.pick!=null&&st.opts[st.pick].c;return '<button class="'+(ok?'ok':'no')+'" data-act="rvjump" data-i="'+i+'">'+(i+1)+'</button>'}).join('')+'</div>';
  SES.steps.forEach((s,i)=>{const st=SES.sts[i],ok=st.pick!=null&&st.opts[st.pick].c;if(SES.reviewWrong&&ok)return;const mine=st.pick!=null?st.opts[st.pick].t:'(bỏ trống)',cor=st.opts.find(o=>o.c).t;
    h+='<div class="rv" id="rv'+i+'"><p class="hint">Câu '+(i+1)+' · '+XT[s.ex]+'</p><p class="q">'+(s.t==='err'?esc(s.parts.join(' ')):s.sign?'Biển báo: '+esc(s.sign):s.ins==='pron'||s.ins==='stressQ'?esc(s.q):s.q)+'</p>'+(s.ins==='pron'||s.ins==='stressQ'?'<p>'+s.o.map(uline).join(' · ')+'</p>':'')+'<p>Bạn chọn: <span class="'+(ok?'okt':'not')+'">'+(s.htmlOpts?uline(mine):esc(mine))+'</span></p>'+(ok?'':'<p>Đáp án: <span class="okt">'+(s.htmlOpts?uline(cor):esc(cor))+'</span></p>')+(s.e?'<p class="hint">'+esc(s.e)+'</p>':'')+'</div>'});
  h+='</div><div class="row"><button class="btn pri" data-act="leave">Xong</button>'+(Object.values(S.errs).some(e=>!e.last)?'<button class="btn" data-act="wrong">Làm lại các câu sai</button>':'')+'</div>';
  return h;

/* ---------- step renderers ---------- */
const showVi=st=>S.cfg.vi?!st.viOff:!!st.vi;
function head(s,st,exam){
  const k=s.ins||(s.ctx?'read':s.t),I=INS[k]||INS.mcq,on=showVi(st),has=!!S.notes[itemKey(s,st)];
  let h='<div class="shead"><p class="ins">'+esc(I[0])+'</p><div class="tools"><button class="tool'+(on?' on':'')+'" data-act="tr">VI</button>'+(exam?'':'<button class="tool'+(has?' has':'')+(st.noteOpen?' on':'')+'" data-act="note">'+(has?'Ghi chú ✓':'Ghi chú')+'</button>')+'</div></div>';
  if(on){const L=[esc(I[1])];if(s.ctxvi)L.push('<b>Dịch đoạn văn:</b> '+esc(s.ctxvi));if(s.qvi)L.push('<b>Câu hỏi:</b> '+esc(s.qvi));if(s.sign&&s.e)L.push('<b>Biển báo:</b> '+esc(s.e));h+='<div class="vi">'+L.map(x=>'<p>'+x+'</p>').join('')+'</div>'}
  return h;
}
function optsHTML(s,st,exam){return '<div class="opts">'+st.opts.map((o,i)=>{let c='opt';if(exam){if(st.pick===i)c+=' sel'}else if(st.done){if(o.c)c+=' ok';else if(st.pick===i)c+=' no'}return '<button class="'+c+'" data-act="pick" data-i="'+i+'"'+(!exam&&st.done?' disabled':'')+'><span class="bb">'+LET[i]+'</span><span>'+(s.htmlOpts?uline(o.t):esc(o.t))+'</span></button>'}).join('')+'</div>'}
function qBody(s,st,exam){
  let h=head(s,st,exam);
  if(s.ctx)h+='<div class="passage">'+s.ctx+'</div>';
  if(s.sign)h+='<div class="sign">'+esc(s.sign)+'</div>';
  if(s.t==='err')h+='<p class="esent">'+s.parts.map((p,i)=>'<u>'+esc(p)+'</u><sup>'+LET[i]+'</sup>').join(' ')+'</p>';
  else if(s.t==='listen')h+='<div class="row t" style="margin-top:10px"><button class="btn blue" data-act="say" data-t="'+esc(s.s)+'">Nghe</button>'+sayBtn(s.s,'Nghe chậm','0.7','')+'</div><p class="qtext">'+s.q+'</p>';
  else if(!(s.ins==='pron'||s.ins==='stressQ'))h+='<p class="qtext">'+s.q+'</p>';
  if(s.ipa)h+='<p class="ipa hint">'+esc(s.ipa)+'</p>';
  if(s.say&&!exam)h+='<div class="row t" style="margin-top:8px">'+sayBtn(s.say,'Nghe từ')+'</div>';
  h+=optsHTML(s,st,exam);
  return h;
}
const fb=(s,st)=>st.done?'<div class="fb '+(st.ok?'good':'bad')+'" role="status"><b>'+(st.ok?'Correct! Chính xác.':'Not quite. Chưa đúng.')+'</b>'+(st.ok?'':' Đáp án: <b>'+(s.htmlOpts?uline(ansText(s,st)):esc(ansText(s,st)))+'</b>')+(s.e?'<p>'+esc(s.e)+'</p>':'')+'</div><div class="row"><button class="btn pri wide" data-act="next">Tiếp tục</button></div>':'';
function notePanel(s,st){if(!st.noteOpen)return '';const k=itemKey(s,st),tags=st.ntags||[];return '<div class="npanel"><p class="lab">Ghi chú câu này: vì sao mình sai?</p><div class="ntags">'+TAGS.map(([id,l])=>'<button class="ntag'+(tags.includes(id)?' on':'')+'" data-act="ntag" data-id="'+id+'">'+l+'</button>').join('')+'</div><textarea id="ntext" class="inp" style="margin-top:8px" placeholder="Ví dụ: quên since đi với hiện tại hoàn thành">'+esc(st.ndraft||'')+'</textarea><div class="row t" style="margin-top:8px"><button class="btn sm pri" data-act="nsave">Lưu vào Sổ tay</button>'+(S.notes[k]?'<button class="btn sm" data-act="ndel">Xóa</button>':'')+'<button class="btn sm ghost" data-act="note">Đóng</button></div></div>'}
const R={};
R.tip=(s,st)=>'<div class="card">'+head(s,st)+'<h2 style="margin-top:6px">'+esc(s.title)+'</h2><div class="prose" style="margin-top:10px">'+s.html+'</div><div class="row"><button class="btn pri wide" data-act="next">Đã hiểu, làm bài</button></div></div>';

function feedbackHTML(acc){
  const sk=Object.entries(SES.sk).map(([k,r])=>({k,n:r.n,ok:r.ok,p:Math.round(r.ok/r.n*100)})).sort((a,b)=>a.p-b.p);
  if(!sk.length)return '';
  const pv=SES.prev||[],pa=pv.length?Math.round(pv.reduce((a,h)=>a+h.acc,0)/pv.length):null,L=[];
  if(acc!=null)L.push(acc>=90?'Rất chắc tay: '+acc+'% đúng. Chuyển sang bài tiếp theo được rồi.':acc>=75?'Tốt: '+acc+'% đúng. Xem lại vài câu sai bên dưới.':acc>=55?'Tạm được: '+acc+'% đúng. Nên làm lại bài này thêm 1 lần.':'Còn yếu ('+acc+'%). Đọc lại phần ghi nhớ, bấm VI khi chưa hiểu đề, rồi làm lại câu sai.');
  if(pa!=null&&acc!=null){const d=acc-pa;L.push(Math.abs(d)<5?'Ổn định so với 5 buổi gần nhất ('+pa+'%).':d>0?'Tiến bộ <b>+'+d+'%</b> so với trung bình 5 buổi gần nhất.':'Thấp hơn trung bình 5 buổi gần nhất '+(-d)+'%. Có thể bài khó hơn, nghỉ chút rồi làm lại.')}
  const weak=sk[0];if(sk.length>1&&weak.p<80)L.push('Phần yếu nhất buổi này: <b>'+XT2[weak.k]+'</b> ('+weak.ok+'/'+weak.n+').');
  let h='<div class="card stack"><p class="lab">Nhận xét</p><div class="prose">'+L.map(x=>'<p>'+x+'</p>').join('')+'</div>'+(sk.length>1?sk.map(x=>'<div class="hb"><span>'+XT2[x.k]+'</span>'+prog(x.p,x.p>=80?'g':x.p<60?'r':'')+'<b>'+x.ok+'/'+x.n+'</b></div>').join(''):'');
  if(SES.wlog.length)h+='<details><summary>Câu sai và đáp án ('+SES.wlog.length+')</summary>'+SES.wlog.map(w=>'<div class="rv"><p class="q">'+esc(w.label)+'</p>'+(w.mine?'<p>Bạn chọn: <span class="not">'+esc(String(w.mine).replace(/[\[\]]/g,''))+'</span></p>':'')+(w.ans?'<p>Đáp án: <span class="okt">'+esc(w.ans)+'</span></p>':'')+(w.e?'<p class="hint">'+esc(w.e)+'</p>':'')+'</div>').join('')+'</details>';
  if(weak&&weak.p<80&&XT[weak.k])h+='<div class="row t"><button class="btn sm pri" data-act="drill" data-id="'+weak.k+'">Luyện thêm: '+XT[weak.k]+'</button></div>';
  return h+'</div>';
}

/* ================= merge two progress states ================= */
function mergeState(a,b){
  a=Object.assign(defaults(),a||{});b=Object.assign(defaults(),b||{});
  if((b.resetAt||0)>(a.resetAt||0)){const t=a;a=b;b=t;}
  if(a.resetAt&&(b.ts||0)<a.resetAt)return a;
  const newer=(b.ts||0)>(a.ts||0)?b:a,o=Object.assign({},newer);
  o.cfg=Object.assign(defaults().cfg,newer.cfg||{});
  o.xp=Math.max(a.xp||0,b.xp||0);o.sessions=Math.max(a.sessions||0,b.sessions||0);
  o.days={};[a.days,b.days].forEach(d=>Object.keys(d||{}).forEach(k=>o.days[k]=Math.max(o.days[k]||0,d[k]||0)));
  ['topics','gram'].forEach(f=>{o[f]={};[a[f],b[f]].forEach(U=>Object.keys(U||{}).forEach(k=>{const x=U[k]||{},y=o[f][k]||{};o[f][k]={done:Math.max(x.done||0,y.done||0),best:Math.max(x.best||0,y.best||0)}}))});
  o.srs={};[a.srs,b.srs].forEach(R=>Object.keys(R||{}).forEach(k=>{const x=R[k],y=o.srs[k];if(!y||x.d>y.d)o.srs[k]=x}));
  o.del=Object.assign({},a.del||{});Object.keys(b.del||{}).forEach(k=>o.del[k]=Math.max(o.del[k]||0,b.del[k]));
  const byTs=(A,B)=>{const r={};[A,B].forEach(X=>Object.keys(X||{}).forEach(k=>{if(!r[k]||(X[k].ts||0)>(r[k].ts||0))r[k]=X[k]}));return r};
  o.notes=byTs(a.notes,b.notes);Object.keys(o.notes).forEach(k=>{if((o.del['n:'+k]||0)>=(o.notes[k].ts||0))delete o.notes[k]});
  o.errs=byTs(a.errs,b.errs);
  const un=(A,B,n)=>{const m={};(A||[]).concat(B||[]).forEach(h=>m[h.ts]=h);return Object.values(m).sort((x,y)=>x.ts-y.ts).slice(-n)};
  o.mocks=un(a.mocks,b.mocks,100);o.hist=un(a.hist,b.hist,80);
  o.today=Object.assign({},a.today||{});Object.keys(b.today||{}).forEach(k=>o.today[k]=Math.max(o.today[k]||0,b.today[k]));
  o.resetAt=Math.max(a.resetAt||0,b.resetAt||0);o.ts=Math.max(a.ts||0,b.ts||0);
  return o;
}

async function gsSync(loud){
  if(!gsOn()||gsBusy)return;gsBusy=true;
  try{
    const r=await fetch(GS.url+(GS.url.includes('?')?'&':'?')+'key='+encodeURIComponent(GS.key)+'&t='+Date.now(),{method:'GET'});
    const txt=await r.text();let remote={};try{remote=JSON.parse(txt||'{}')}catch(e){throw new Error('bad')}
    if(remote&&remote.error)throw new Error(remote.error);
    const before=JSON.stringify(S);
    if(remote&&remote.ts){S=mergeState(S,remote)}
    saveLocal();
    await fetch(GS.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:GS.key,data:S})});
    GS.last=Date.now();gsSaveCfg();gsMsg='';
    if(JSON.stringify(S)!==before&&!SES)render();
    if(loud){toast('Đã đồng bộ với Google Drive.');if(!SES)render()}
  }catch(e){
    gsMsg=String(e&&e.message)==='key'?'Sai mã bí mật. Kiểm tra lại mã đồng bộ.':'Không kết nối được Google. Kiểm tra mạng; nếu đang mở trong Claude thì đồng bộ Google không chạy được (Claude chặn kết nối ra ngoài), hãy dùng file tải về.';
    if(loud){toast(gsMsg);if(!SES)render()}
  }finally{gsBusy=false}
}

const GS_SCRIPT=`// Vào 10: lưu tiến độ vào Google Drive
const SECRET = 'DOI-THANH-MA-CUA-BAN'; // đổi thành một mật khẩu riêng
const NAME = 'vao10-sync.json';

function file_() {
  const it = DriveApp.getFilesByName(NAME);
  return it.hasNext() ? it.next() : DriveApp.createFile(NAME, '{}', 'application/json');
}
function json_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
function doGet(e) {
  if (e.parameter.key !== SECRET) return json_({ error: 'key' });
  return ContentService.createTextOutput(file_().getBlob().getDataAsString()).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  const b = JSON.parse(e.postData.contents);
  if (b.key !== SECRET) return json_({ error: 'key' });
  const lock = LockService.getScriptLock(); lock.waitLock(10000);
  try { file_().setContent(JSON.stringify(b.data)); } finally { lock.releaseLock(); }
  return json_({ ok: true });
}`;
